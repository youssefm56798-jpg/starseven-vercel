<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-hidden="true">
  <!-- Type 1 is a blunt-cut curtain: five dead-straight strands fanning a little from the crown and stopping together on one hem, with butt caps so that hem stays flat. The uneven pitch and the five different weights are what stop it reading as a printed rule. -->
  <!-- currentColor, resolved to ink by the color attribute below, so the file still
       reads as an ink drawing when it is loaded as an <img> on the hair-type pages,
       which inherit nothing from the page around them. On the home tiles the same
       file is a CSS mask, where only the alpha matters and the tile paints it. -->
  <g fill="none" stroke="currentColor" stroke-linecap="butt" stroke-linejoin="round" color="#12100B">
    <path stroke-width="3.0" d="M12.2 9 10.8 39.5"/>
    <path stroke-width="3.6" d="M18.6 6.8 18 39.5"/>
    <path stroke-width="3.6" d="M25.2 6.2 25.6 39.5"/>
    <path stroke-width="3.4" d="M31.6 7 32.6 39.5"/>
    <path stroke-width="2.8" d="M37.4 9.4 39 39.5"/>
  </g>
</svg>
