<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-hidden="true">
  <!-- High density is the same idea inverted: six of the heaviest strands in the set, packed until they nearly touch and run off the top and bottom of the frame. They bow rather than wave, so this is a density mark and not the wavy mark with more strands on it. -->
  <!-- currentColor, resolved to ink by the color attribute below, so the file still
       reads as an ink drawing when it is loaded as an <img> on the hair-type pages,
       which inherit nothing from the page around them. On the home tiles the same
       file is a CSS mask, where only the alpha matters and the tile paints it. -->
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" color="#12100B">
    <path stroke-width="3.9" d="M7.6 8C6.4 18 8.4 30 7.8 42"/>
    <path stroke-width="4.2" d="M14.4 6.4C13.2 18 15.2 30 14.2 42.6"/>
    <path stroke-width="4.2" d="M21 5.6C20.4 18 22 30 21 43"/>
    <path stroke-width="4.2" d="M28 5.6C28.6 18 27 30 28 43"/>
    <path stroke-width="4.2" d="M34.6 6.4C35.8 18 33.8 30 34.8 42.6"/>
    <path stroke-width="3.9" d="M41.4 8C42.6 18 40.6 30 41.2 42"/>
  </g>
</svg>
