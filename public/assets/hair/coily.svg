<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-hidden="true">
  <!-- Type 4 is a spring, not a curve: tight angular zigzags with mitred corners, at the highest frequency and the smallest amplitude in the set. The short third coil sits between the two long ones because coily hair is dense, and because an even pair would look printed. -->
  <!-- currentColor, resolved to ink by the color attribute below, so the file still
       reads as an ink drawing when it is loaded as an <img> on the hair-type pages,
       which inherit nothing from the page around them. On the home tiles the same
       file is a CSS mask, where only the alpha matters and the tile paints it. -->
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="miter" color="#12100B">
    <path stroke-width="3.4" d="M13.4 6.4 18.6 10 11.6 13.4 18.8 17 11.4 20.4 18.6 24 11.6 27.4 18.4 31 12 34.4 16.4 38 13.8 41.6"/>
    <path stroke-width="3.4" d="M29.6 6 35.8 9.8 28.8 13.4 36 17.2 28.6 20.8 35.8 24.6 28.8 28.2 35.4 32 29.6 35.6 33.4 39.2 31 42.4"/>
    <path stroke-width="2.3" d="M23 15.6 26.6 18.4 21.4 21.2 26.4 24 21.6 26.8 25.4 29.6"/>
  </g>
</svg>
