<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-hidden="true">
  <!-- A fade is a gradient, so the icon is one: length at the top, then ticks that get shorter and lighter row by row, ending on a clean line. It is the only mark in this set built out of four rows instead of a few long strokes, which is what makes it read as a cut rather than as hair. The top row carries the length the customer actually has to style — the tile says the sides are the barbers and the top is yours, and the top row is where all the weight is. -->
  <!-- currentColor, resolved to ink by the color attribute below, so the file still
       reads as an ink drawing when it is loaded as an <img> on the style detail hero,
       which inherits nothing from the page around it. On the cards and the home strip
       the same file is a CSS mask, where only the alpha matters and the tile paints it. -->
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" color="#12100B">
    <path stroke-width="3.4" d="M11 7.5C14 13.5 12 17.5 11 22"/>
    <path stroke-width="3.8" d="M24 5.5C27.5 12.5 25.5 17 24 22"/>
    <path stroke-width="3.2" d="M37 7.5C40 13.5 38 17.5 37 22"/>
    <path stroke-width="2.6" d="M10 27v6M20 26.5v6.5M28.5 26.5v6.5M38.5 27v6"/>
    <path stroke-width="2" d="M8 36.5v3M15 36v3.5M22 36.5v3M29 36v3.5M36 36.5v3M42.5 36v3.5"/>
    <path stroke-width="2.6" d="M7 43.5h34"/>
  </g>
</svg>
