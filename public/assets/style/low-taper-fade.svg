<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-hidden="true">
  <!-- A right-facing head whose two halves disagree on purpose. The top keeps its length,
       drawn as upright strokes, while the back and side are a column of ticks that shrink
       row by row down to bare skin at the nape. That graded short-to-nothing edge is the
       low taper, and the length standing above it is the part the tile says the barber
       leaves for the customer to style. -->
  <!-- currentColor, resolved to ink by the color attribute below, so the file still
       reads as an ink drawing when it is loaded as an <img> on the style detail hero,
       which inherits nothing from the page around it. On the cards and the home strip
       the same file is a CSS mask, where only the alpha matters and the tile paints it. -->
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" color="#12100B" transform="translate(-2.5 0.5)">
